[project]
name = "orchestrator"
version = "0.1.0"
description = "LLM trip-planning orchestrator (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.39",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv]
package = true
